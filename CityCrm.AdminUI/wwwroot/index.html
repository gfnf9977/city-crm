<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CityCrm.AdminUI</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="CityCrm.AdminUI.styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>
    <script src="js/map.js"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        let pickerMap = null;
        let pickerMarker = null;
        let pickerPolygon = null;

        window.initMapPicker = (lat, lng, dotNetHelper, otherPolygons = []) => {
            if (pickerMap !== null) {
                pickerMap.off();
                pickerMap.remove();
            }

            let startLat = lat !== 0 ? lat : 51.4938;
            let startLng = lng !== 0 ? lng : 31.2953;

            pickerMap = L.map('mapPicker').setView([startLat, startLng], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(pickerMap);

            pickerMap.pm.addControls({
                position: 'topleft',
                drawMarker: false,
                drawCircleMarker: false,
                drawPolyline: false,
                drawCircle: false,
                drawText: false,
                drawPolygon: true,
                drawRectangle: false,
                editMode: true,
                dragMode: false,
                cutPolygon: false,
                removalMode: true
            });

            if (lat !== 0 && lng !== 0) {
                pickerMarker = L.marker([lat, lng]).addTo(pickerMap);
            }

            pickerMap.on('click', function(e) {
                if (pickerMap.pm.globalDrawModeEnabled()) return;

                if (pickerMarker) { pickerMarker.setLatLng(e.latlng); }
                else { pickerMarker = L.marker(e.latlng).addTo(pickerMap); }
                dotNetHelper.invokeMethodAsync('SetPickedCoordinates', e.latlng.lat, e.latlng.lng);
            });

            pickerMap.on('pm:create', function(e) {
                if (pickerMarker) { pickerMap.removeLayer(pickerMarker); pickerMarker = null; }
                if (pickerPolygon) { pickerMap.removeLayer(pickerPolygon); pickerPolygon = null; }

                let layer = e.layer;

                let geoJsonData = layer.toGeoJSON().geometry;
                let geoJsonStr = JSON.stringify(geoJsonData);

                dotNetHelper.invokeMethodAsync('SetDrawnGeoJson', geoJsonStr);

                layer.on('pm:edit', function(editEvent) {
                    let updatedGeoJson = editEvent.target.toGeoJSON().geometry;
                    dotNetHelper.invokeMethodAsync('SetDrawnGeoJson', JSON.stringify(updatedGeoJson));
                });
            });

            pickerMap.on('pm:remove', function(e) {
                dotNetHelper.invokeMethodAsync('SetDrawnGeoJson', null);
            });

            setTimeout(() => { pickerMap.invalidateSize(); }, 300);

            otherPolygons.forEach(geoJsonStr => {
                if (geoJsonStr) {
                    let geoJson = JSON.parse(geoJsonStr);
                    L.geoJSON(geoJson, {
                        style: { color: '#000000', weight: 1.5, fillOpacity: 0.15 },
                        interactive: false
                    }).addTo(pickerMap);
                }
            });
        };

        window.drawOsmPolygon = (geoJsonStr) => {
            if (!pickerMap) return;
            let geoJson = JSON.parse(geoJsonStr);
            if (pickerMarker) { pickerMap.removeLayer(pickerMarker); pickerMarker = null; }
            if (pickerPolygon) { pickerMap.removeLayer(pickerPolygon); }

            pickerPolygon = L.geoJSON(geoJson, {
                style: { color: '#007bff', weight: 2, fillOpacity: 0.5 }
            }).addTo(pickerMap);
            pickerMap.fitBounds(pickerPolygon.getBounds());
        };

        window.centerMapPicker = (lat, lng) => {
            if (pickerMap) {
                pickerMap.setView([lat, lng], 19, { animate: true, duration: 1 });
            }
        };
    </script>
    <script>
        window.scrollToElement = (id) => {
            const el = document.getElementById(id);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        };
    </script>
</body>

</html>
