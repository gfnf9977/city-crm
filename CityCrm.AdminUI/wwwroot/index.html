<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CityCrm.AdminUI</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="CityCrm.AdminUI.styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/map.js"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        let pickerMap = null;
        let pickerMarker = null;
        let pickerPolygon = null;

        window.initMapPicker = (lat, lng, dotNetHelper) => {
            if (pickerMap !== null) { pickerMap.remove(); }
            
            let startLat = lat !== 0 ? lat : 51.4938;
            let startLng = lng !== 0 ? lng : 31.2953;

            pickerMap = L.map('mapPicker').setView([startLat, startLng], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(pickerMap);

            if (lat !== 0 && lng !== 0) {
                pickerMarker = L.marker([lat, lng]).addTo(pickerMap);
            }

            pickerMap.on('click', function(e) {
                if (pickerMarker) {
                    pickerMarker.setLatLng(e.latlng); 
                } else {
                    pickerMarker = L.marker(e.latlng).addTo(pickerMap); 
                }
                dotNetHelper.invokeMethodAsync('SetPickedCoordinates', e.latlng.lat, e.latlng.lng);
            });

            setTimeout(() => { pickerMap.invalidateSize(); }, 300);
        };

        window.drawOsmPolygon = (geoJsonStr) => {
            if (!pickerMap) return;

            let geoJson = JSON.parse(geoJsonStr);

            if (pickerMarker) { pickerMap.removeLayer(pickerMarker); pickerMarker = null; }
            if (pickerPolygon) { pickerMap.removeLayer(pickerPolygon); }

            pickerPolygon = L.geoJSON(geoJson, {
                style: { color: '#007bff', weight: 2, fillOpacity: 0.5 }
            }).addTo(pickerMap);

            pickerMap.fitBounds(pickerPolygon.getBounds());
        };
    </script>
</body>

</html>
